<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b50">
  <meta name="description" content="簿記2級・税理士簿記論の仕訳を、オフラインで繰り返し練習。電卓付きの仕訳トレーニング。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="仕訳トレ">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>仕訳トレーニング</title>
</head>
<body>
  <a class="skip-link" href="#app">本文へ</a>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="仕訳トレーニング ホーム"><span class="brand-mark" aria-hidden="true">仕</span><span>仕訳トレーニング<small>毎日、仕訳の瞬発力を。</small></span></a>
    <span id="connection" class="connection" role="status">準備中</span>
  </header>
  <div id="update-banner" class="notice" hidden>新しいバージョンがあります。<button id="apply-update" type="button">更新する</button></div>
  <div id="storage-warning" class="notice error" role="alert" hidden></div>
  <main id="app" tabindex="-1"><p class="loading">問題を準備しています…</p></main>
  <nav id="main-nav" class="main-nav" aria-label="メインメニュー">
    <a href="#home" data-nav="home"><span aria-hidden="true">⌂</span>ホーム</a>
    <a href="#review" data-nav="review"><span aria-hidden="true">↻</span>復習</a>
    <a href="#stats" data-nav="stats"><span aria-hidden="true">▤</span>学習記録</a>
  </nav>
  <div id="training-dock" class="training-dock" hidden></div>
  <dialog id="account-dialog" aria-labelledby="account-title">
    <div class="dialog-top"><h2 id="account-title">勘定科目を選択</h2><button class="icon-button" data-close="account-dialog" aria-label="閉じる">×</button></div>
    <input id="account-search" type="search" placeholder="科目名で検索" autocomplete="off" aria-label="勘定科目を検索">
    <p class="small muted">候補からタップして選択</p>
    <div id="account-options" class="account-options"></div>
    <button id="all-accounts" class="text-button">すべての科目から選ぶ</button>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2><p id="confirm-body"></p>
    <div class="dialog-actions"><button id="confirm-cancel" class="secondary">戻る</button><button id="confirm-ok" class="primary">実行する</button></div>
  </dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <noscript>このアプリにはJavaScriptが必要です。Safariの設定でJavaScriptを有効にしてください。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
